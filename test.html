<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Clipper Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #101114;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 22px;
            background: #1c1e24;
            border-radius: 14px;
        }

        h1 {
            font-size: 25px;
        }

        p {
            color: #b9bbc4;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input, button {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
        }

        input {
            color: white;
            background: #292c34;
            border: 1px solid #454956;
        }

        button {
            margin-top: 20px;
            background: #6c63ff;
            color: white;
            border: none;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.5;
        }

        #status {
            margin-top: 20px;
            overflow-wrap: anywhere;
        }

        #download {
            display: none;
            margin-top: 20px;
            padding: 14px;
            background: #176b45;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
        }

        video {
            display: none;
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
        }

        .small {
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Video Clipper Test</h1>

    <p>
        Upload a video, select the section you want,
        and download the trimmed MP4.
    </p>

    <form id="clipForm">

        <label for="videoFile">Choose a video</label>

        <input
            type="file"
            id="videoFile"
            accept="video/*"
            required
        >

        <label for="start">Start time</label>

        <input
            type="text"
            id="start"
            value="00:00:05"
            placeholder="00:00:05"
            required
        >

        <label for="end">End time</label>

        <input
            type="text"
            id="end"
            value="00:00:15"
            placeholder="00:00:15"
            required
        >

        <p class="small">
            Use HH:MM:SS format. Example: 00:01:30
            means 1 minute and 30 seconds.
            Maximum clip length: 10 minutes.
            Maximum upload size: 100 MB.
        </p>

        <button id="submitButton" type="submit">
            Trim Video
        </button>

    </form>

    <div id="status" role="status">
        Ready to process your video.
    </div>

    <video id="preview" controls></video>

    <a id="download" href="#" download="clip.mp4">
        Download MP4 Clip
    </a>

</div>

<script>
    const API_URL =
        "https://youtube-clipper-backend-cy9k.onrender.com";

    const form = document.getElementById("clipForm");
    const fileInput = document.getElementById("videoFile");
    const startInput = document.getElementById("start");
    const endInput = document.getElementById("end");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");
    const download = document.getElementById("download");

    let currentObjectURL = null;

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const file = fileInput.files[0];

        if (!file) {
            status.textContent = "Please select a video.";
            return;
        }

        if (file.size > 100 * 1024 * 1024) {
            status.textContent =
                "Your video exceeds the 100 MB upload limit.";
            return;
        }

        const start = startInput.value.trim();
        const end = endInput.value.trim();

        button.disabled = true;
        button.textContent = "Processing...";
        status.textContent =
            "Uploading video. Large files may take some time.";

        download.style.display = "none";
        preview.style.display = "none";

        if (currentObjectURL) {
            URL.revokeObjectURL(currentObjectURL);
            currentObjectURL = null;
        }

        try {
            const formData = new FormData();

            formData.append("video", file);
            formData.append("start", start);
            formData.append("end", end);

            const response = await fetch(
                API_URL + "/trim",
                {
                    method: "POST",
                    body: formData
                }
            );

            if (!response.ok) {
                const contentType =
                    response.headers.get("content-type") || "";

                let message = "Video processing failed.";

                if (contentType.includes("application/json")) {
                    const data = await response.json();
                    message = data.error || message;
                } else {
                    message = await response.text() || message;
                }

                throw new Error(message);
            }

            const blob = await response.blob();

            currentObjectURL = URL.createObjectURL(blob);

            download.href = currentObjectURL;
            download.download = "clip.mp4";
